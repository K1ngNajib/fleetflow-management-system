<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NDA Fleet Maintenance & Logistics Command System</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/notifications.css" />
</head>
<body>
  <!-- NDA Fleet Maintenance & Logistics Command System: offline-first single page application shell. -->
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-panel">
      <div class="login-logo" aria-label="NDA command crest">NDA</div>
      <h1>NDA Fleet Maintenance & Logistics Command System</h1>
      <p>Offline maintenance operations center. Default login: <strong>admin</strong> / <strong>admin123</strong></p>
      <label>Username<input name="username" autocomplete="username" required /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="btn btn-primary" type="submit">Secure Login</button>
      <div id="login-error" class="form-error"></div>
    </form>
  </section>

  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><button id="toggle-sidebar" class="icon-btn" title="Collapse sidebar">☰</button><div><strong>NDA Command</strong><span>Maintenance Ops</span></div></div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer"><span id="current-user"></span><button id="logout-btn" class="btn btn-ghost">Logout</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h2 id="page-title">Dashboard</h2><p id="page-subtitle">Nigerian Defence Academy Fleet Maintenance Command</p></div>
        <input id="global-search" class="global-search" placeholder="Global search vehicles, jobs, servicing, inventory, notifications..." />
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/users.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/maintenance.js"></script>
  <script src="js/servicing.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
